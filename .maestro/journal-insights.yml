appId: com.tehknesolutions.bemmecuida.dev
name: Diário emocional e insights locais
---
- launchApp:
    clearState: true
- assertVisible:
    id: sign-in-title
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: sign-in-submit
- assertVisible:
    id: home-title
- tapOn: "Diário"
- assertVisible: "Um espaço para colocar em palavras"
- tapOn:
    id: journal-body
- inputText: "Registro sintetico para validar o diario local-first"
- tapOn: "Ansiedade"
- scrollUntilVisible:
    element:
      id: journal-save
    direction: DOWN
- tapOn:
    id: journal-save
- assertVisible: "Registro salvo"
- tapOn: "OK"
- tapOn: "Insights"
- assertVisible: "Entenda mudanças no seu padrão"
- assertVisible: "Perguntas úteis para refletir"
