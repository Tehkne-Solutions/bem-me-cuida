appId: com.tehknesolutions.bemmecuida.dev
name: Conta e privacidade
---
- launchApp:
    clearState: true
- assertVisible:
    id: sign-in-title
- tapOn:
    id: sign-in-email
- inputText: ${E2E_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: sign-in-submit
- assertVisible:
    id: home-title
- tapOn:
    id: home-open-settings
- assertVisible:
    id: settings-title
- assertVisible: "Consentimentos"
- scrollUntilVisible:
    element:
      id: settings-export
    direction: DOWN
- assertVisible:
    id: settings-export
- scrollUntilVisible:
    element:
      id: settings-sign-out
    direction: DOWN
- assertVisible:
    id: settings-sign-out
