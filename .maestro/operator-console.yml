appId: com.tehknesolutions.bemmecuida.dev
name: Console operacional de releases
---
- launchApp:
    clearState: true
- assertVisible:
    id: sign-in-title
- tapOn:
    id: sign-in-email
- inputText: ${E2E_OPERATOR_EMAIL}
- tapOn:
    id: sign-in-password
- inputText: ${E2E_OPERATOR_PASSWORD}
- tapOn:
    id: sign-in-submit
- assertVisible:
    id: home-title
- tapOn:
    id: home-open-settings
- assertVisible:
    id: settings-title
- scrollUntilVisible:
    element:
      id: settings-open-operator-console
    direction: DOWN
- tapOn:
    id: settings-open-operator-console
- assertVisible:
    id: operator-console-title
- scrollUntilVisible:
    element:
      id: operator-rc-number
    direction: DOWN
- assertVisible:
    id: operator-rc-number
- assertVisible:
    id: operator-candidate-title
- assertVisible:
    id: operator-create-candidate
- scrollUntilVisible:
    element:
      id: operator-status-qa
    direction: DOWN
    optional: true
- assertVisible:
    id: operator-status-qa
    optional: true
- assertVisible:
    id: operator-status-approved
    optional: true
- scrollUntilVisible:
    element:
      id: operator-register-build
    direction: DOWN
    optional: true
- assertVisible:
    id: operator-register-build
    optional: true
- assertVisible:
    id: operator-promote-release
    optional: true
