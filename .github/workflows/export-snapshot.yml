name: Export repository snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/export-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create snapshot
        run: tar --exclude=.git -czf bem-me-cuida-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: bem-me-cuida-snapshot
          path: bem-me-cuida-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
