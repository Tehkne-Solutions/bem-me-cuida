name: Sprint 64

on:
  pull_request:
    paths:
      - 'governance/cycle-0.12/administrative-closure-package-validation-policy.json'
      - 'scripts/validate-cycle012-administrative-closure-package.mjs'
      - 'scripts/test-cycle012-administrative-closure-package-validation.mjs'
      - 'scripts/verify-sprint64-readiness.mjs'
      - 'docs/governance/sprint-64-administrative-closure-package-validation.md'
      - 'docs/adr/068-cycle-012-administrative-closure-package-validation.md'
      - '.github/workflows/sprint64.yml'

permissions:
  contents: read

env:
  APP_VARIANT: development
  EXPO_PUBLIC_APP_ENV: development
  EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

jobs:
  sprint64-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: node scripts/verify-sprint64-readiness.mjs
      - run: node scripts/test-cycle012-administrative-closure-package-validation.mjs
