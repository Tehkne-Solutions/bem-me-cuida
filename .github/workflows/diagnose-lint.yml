name: Diagnose Lint

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-lint.yml'
      - 'apps/mobile/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - name: Capture lint
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          echo $? > /tmp/lint.code
          cat /tmp/lint.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: lint-diagnostics
          path: |
            /tmp/lint.log
            /tmp/lint.code
          retention-days: 1
