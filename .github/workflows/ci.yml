name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - name: Run TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-log
          path: /tmp/typecheck.log
          retention-days: 1
      - run: npm run lint
      - run: npm run test
      - run: npm run config:public --workspace @bemmecuida/mobile

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: supabase start
      - name: Run database tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-failure-log
          path: /tmp/pgtap.log
          retention-days: 1
      - run: supabase db lint --local
      - if: always()
        run: supabase stop --no-backup
