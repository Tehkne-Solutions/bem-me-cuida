name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - name: Run release check
        shell: bash
        run: |
          set -o pipefail
          npm run release:check 2>&1 | tee /tmp/release-check.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-failure-log
          path: /tmp/release-check.log
          retention-days: 1
      - name: Run TypeScript
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee /tmp/typecheck.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-failure-log
          path: /tmp/typecheck.log
          retention-days: 1
      - run: npm run lint
      - run: npm run test
      - run: npm run governance:report
      - run: npm run cycle:report
      - run: npm run rc011:validation:report
      - run: npm run rc011:gates:payload
      - run: npm run rc011:homologation:structure
      - run: npm run rc011:decision:package
      - run: npm run rc011:infrastructure:structure
      - run: npm run rc011:infrastructure:report
      - name: Run RC 0.11 bootstrap check
        shell: bash
        run: |
          set -o pipefail
          npm run rc011:bootstrap:check 2>&1 | tee /tmp/rc011-bootstrap-check.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc011-bootstrap-check-failure-log
          path: /tmp/rc011-bootstrap-check.log
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: rc011-bootstrap-${{ github.run_id }}
          path: artifacts/rc011-bootstrap
          retention-days: 7
      - name: Validate RC 0.11 issue commands
        run: npm run rc011:command:test
      - name: Validate RC 0.11 external audit
        run: npm run rc011:external-audit:test
      - name: Validate RC 0.11 administrative bootstrap
        run: npm run rc011:admin-bootstrap:test
      - name: Validate RC 0.11 release transition
        run: npm run rc011:release-transition:test
      - name: Validate RC 0.11 Android artifact custody
        run: |
          npm run rc011:android-artifact:test
          npm run rc011:android-artifact:structure
      - name: Generate factual RC 0.11 issue status
        run: npm run rc011:command:status
      - uses: actions/upload-artifact@v4
        with:
          name: rc011-command-status-${{ github.run_id }}
          path: artifacts/rc011-issue-status.md
          retention-days: 7
      - run: npm run config:public --workspace @bemmecuida/mobile
      - name: Validate production Expo config
        env:
          APP_VARIANT: production
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_PRODUCTION_RELEASE: '1'
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
        run: npm run config:public --workspace @bemmecuida/mobile
      - name: Validate hotfix Expo config
        env:
          APP_VARIANT: rc
          EXPO_PUBLIC_APP_ENV: hotfix-validation
          EXPO_PUBLIC_RELEASE_CANDIDATE: hotfix
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
        run: npm run config:public --workspace @bemmecuida/mobile
      - name: Validate RC 0.11 Expo config
        env:
          APP_VARIANT: rc011
          EXPO_PUBLIC_APP_ENV: rc-0-11
          EXPO_PUBLIC_APP_VERSION: 0.11.0
          EXPO_PUBLIC_RELEASE_CANDIDATE: '1'
          EXPO_PUBLIC_ANDROID_VERSION_CODE: '11001'
          EXPO_PUBLIC_IOS_BUILD_NUMBER: '11001'
          EXPO_PUBLIC_EAS_PROJECT_ID: 00000000-0000-4000-8000-000000000000
        run: npm run config:public --workspace @bemmecuida/mobile

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: supabase start
      - name: Run database tests
        shell: bash
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee /tmp/pgtap.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pgtap-failure-log
          path: /tmp/pgtap.log
          retention-days: 1
      - run: supabase db lint --local
      - if: always()
        run: supabase stop --no-backup
