name: Sprint 39

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/cycle012-resolution-proposal.yml'
      - '.github/workflows/sprint39.yml'
      - 'release/cycle-0.12.0/resolution-proposal-policy.json'
      - 'release/cycle-0.12.0/resolution-proposals/**'
      - 'scripts/lib/cycle012-resolution-proposal.mjs'
      - 'scripts/create-cycle012-resolution-proposal.mjs'
      - 'scripts/test-cycle012-resolution-proposal.mjs'
      - 'scripts/verify-cycle012-resolution-proposal.mjs'
      - 'scripts/verify-sprint39-readiness.mjs'
      - 'docs/SPRINT-39.md'
      - 'docs/ADR-043-propostas-humanas-de-resolucao.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/cycle012-resolution-proposal.yml'
      - '.github/workflows/sprint39.yml'
      - 'release/cycle-0.12.0/resolution-proposal-policy.json'
      - 'release/cycle-0.12.0/resolution-proposals/**'
      - 'scripts/lib/cycle012-resolution-proposal.mjs'
      - 'scripts/create-cycle012-resolution-proposal.mjs'
      - 'scripts/test-cycle012-resolution-proposal.mjs'
      - 'scripts/verify-cycle012-resolution-proposal.mjs'
      - 'scripts/verify-sprint39-readiness.mjs'

permissions:
  contents: read

jobs:
  sprint39-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate Sprint 39 human resolution proposals
        run: |
          node scripts/verify-sprint39-readiness.mjs
          node scripts/test-cycle012-resolution-proposal.mjs
          node scripts/verify-cycle012-resolution-proposal.mjs structure
          mkdir -p artifacts
          node scripts/verify-cycle012-resolution-proposal.mjs report | tee artifacts/cycle012-resolution-proposal-readiness.txt
      - name: Upload proposal readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle012-resolution-proposal-readiness-${{ github.run_id }}
          path: artifacts/cycle012-resolution-proposal-readiness.txt
          retention-days: 7
