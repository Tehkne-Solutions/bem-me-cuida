name: Sprint 44

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release/cycle-0.12.0/correction-plan-validation-policy.json'
      - 'scripts/lib/cycle012-correction-plan-validation.mjs'
      - 'scripts/test-cycle012-correction-plan-validation.mjs'
      - 'scripts/verify-sprint44-readiness.mjs'
      - 'docs/SPRINT-44.md'
      - 'docs/ADR-048-validacao-dos-planos-de-correcao.md'
      - '.github/workflows/sprint44.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sprint44-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: node scripts/verify-sprint44-readiness.mjs
      - run: node scripts/test-cycle012-correction-plan-validation.mjs
