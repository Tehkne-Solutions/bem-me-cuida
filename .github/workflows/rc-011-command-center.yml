name: RC 0.11 Command Center

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: Comando completo iniciado por /rc011
        required: true
        default: /rc011 status
        type: string
      tracking_issue:
        description: Issue que receberá a resposta
        required: true
        default: '24'
        type: string

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: rc011-command-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 24 && github.event.issue.pull_request == null && startsWith(github.event.comment.body, '/rc011') && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RC011_COMMENT_BODY: ${{ github.event_name == 'workflow_dispatch' && inputs.command || github.event.comment.body }}
      RC011_ACTOR: ${{ github.actor }}
      RC011_ISSUE_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.tracking_issue || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - name: Parse command
        id: parse
        run: node scripts/parse-rc011-issue-command.mjs --output "$GITHUB_OUTPUT"
      - name: Resolve repository permission
        id: permission
        run: |
          PERMISSION=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$RC011_ACTOR/permission" --jq '.user.permission' 2>/dev/null || echo none)
          echo "permission=$PERMISSION" >> "$GITHUB_OUTPUT"
      - name: Authorize command
        env:
          REQUIRED_PRIVILEGE: ${{ steps.parse.outputs.privilege }}
          REPOSITORY_PERMISSION: ${{ steps.permission.outputs.permission }}
        run: |
          case "$REQUIRED_PRIVILEGE" in
            admin) [[ "$REPOSITORY_PERMISSION" == "admin" ]] ;;
            write) [[ "$REPOSITORY_PERMISSION" == "admin" || "$REPOSITORY_PERMISSION" == "maintain" || "$REPOSITORY_PERMISSION" == "write" ]] ;;
            *) exit 1 ;;
          esac
      - name: Show help
        if: steps.parse.outputs.command == 'help'
        run: |
          cat > /tmp/rc011-help.md <<'EOF'
          ## Comandos da RC 0.11

          ```text
          /rc011 status
          /rc011 audit-external
          /rc011 validate-infrastructure <source_sha>
          /rc011 capture-infrastructure <source_sha> <build_evidence_https> <homologation_evidence_https> <services_evidence_https>
          /rc011 evidence-inspect <run_id> <source_sha>
          /rc011 evidence-pr <run_id> <source_sha>
          /rc011 validate-build <source_sha> <cycle_evidence_https>
          /rc011 build-android <source_sha> <cycle_evidence_https>
          /rc011 build-ios <source_sha> <cycle_evidence_https>
          /rc011 discover-android <source_sha>
          /rc011 capture-android-latest <source_sha>
          /rc011 android-artifact-pr <source_sha> <run_id>
          /rc011 discover-ios <source_sha>
          /rc011 capture-ios-latest <source_sha>
          /rc011 ios-artifact-pr <source_sha> <run_id>
          /rc011 android-session <source_sha> <build_uuid> <profile_id> <status> <modo> <versao> <evidence_https> <suite=status,...>
          /rc011 android-session-pr <source_sha> <run_id>
          /rc011 android-review <source_sha>
          /rc011 ios-session <source_sha> <build_uuid> <profile_id> <status> <modo> <versao> <evidence_https> <suite=status,...>
          /rc011 ios-session-pr <source_sha> <run_id>
          /rc011 multiplatform-review <source_sha>
          /rc011 collect-android <source_sha> <build_uuid>
          /rc011 collect-ios <source_sha> <build_uuid>
          /rc011 package-decision <source_sha>
          /rc011 ota-publish <source_sha>
          /rc011 ota-publish-pr <source_sha> <run_id>
          /rc011 ota-session <source_sha> <android|ios> <build_uuid> <profile_id> <versao> <group_id> <publish|rollback> <evidence_https> <check=status,...>
          /rc011 ota-session-pr <source_sha> <run_id>
          /rc011 ota-rollback <source_sha> <published_group_id>
          /rc011 ota-rollback-pr <source_sha> <run_id>
          /rc011 rc-final-review <source_sha>
          /rc011 production-package <source_sha>
          /rc011 final-attestation <source_sha> <release-admin|qa-lead|privacy-security> <approved|rejected> <evidence_https>
          /rc011 final-attestation-pr <source_sha> <run_id>
          /rc011 production-build-android <source_sha>
          /rc011 production-build-ios <source_sha>
          /rc011 production-artifact-pr <source_sha> <run_id>
          /rc011 rollout-observation <source_sha> <1|5|10|25|50|100> <crash_free_pct> <sync_pct> <auth_pct> <critical_count> <blocking_count> <evidence_https>
          /rc011 rollout-observation-pr <source_sha> <run_id>
          ```

          Operações com environments, builds, sessões, OTA, produção ou PR exigem permissão administrativa. Nunca inclua tokens, dados pessoais, conteúdo clínico ou identificadores únicos.

          **Tehkné Solutions**
          EOF
          gh issue comment "$RC011_ISSUE_NUMBER" --body-file /tmp/rc011-help.md
      - name: Publish factual status
        if: steps.parse.outputs.command == 'status'
        run: |
          node scripts/generate-rc011-issue-status.mjs --output /tmp/rc011-status.md
          gh issue comment "$RC011_ISSUE_NUMBER" --body-file /tmp/rc011-status.md
      - name: Dispatch protected operation
        if: steps.parse.outputs.command != 'help' && steps.parse.outputs.command != 'status'
        env:
          COMMAND: ${{ steps.parse.outputs.command }}
          SOURCE_COMMIT: ${{ steps.parse.outputs.sourceCommit }}
          RUN_ID: ${{ steps.parse.outputs.runId }}
          BUILD_ID: ${{ steps.parse.outputs.buildId }}
          PROFILE_ID: ${{ steps.parse.outputs.profileId }}
          PLATFORM: ${{ steps.parse.outputs.platform }}
          GROUP_ID: ${{ steps.parse.outputs.groupId }}
          OTA_ACTION: ${{ steps.parse.outputs.otaAction }}
          OTA_RESULTS: ${{ steps.parse.outputs.otaResults }}
          RESULT_STATUS: ${{ steps.parse.outputs.resultStatus }}
          INSTALLATION_MODE: ${{ steps.parse.outputs.installationMode }}
          OS_VERSION: ${{ steps.parse.outputs.osVersion }}
          SUITE_RESULTS: ${{ steps.parse.outputs.suiteResults }}
          EVIDENCE_URL: ${{ steps.parse.outputs.evidenceUrl }}
          BUILD_EVIDENCE_URL: ${{ steps.parse.outputs.buildEvidenceUrl }}
          HOMOLOGATION_EVIDENCE_URL: ${{ steps.parse.outputs.homologationEvidenceUrl }}
          SERVICES_EVIDENCE_URL: ${{ steps.parse.outputs.servicesEvidenceUrl }}
          CYCLE_EVIDENCE_URL: ${{ steps.parse.outputs.cycleEvidenceUrl }}
          ATTESTATION_ROLE: ${{ steps.parse.outputs.attestationRole }}
          ATTESTATION_DECISION: ${{ steps.parse.outputs.attestationDecision }}
          ROLLOUT_PERCENTAGE: ${{ steps.parse.outputs.rolloutPercentage }}
          CRASH_FREE_PCT: ${{ steps.parse.outputs.crashFreePct }}
          SYNC_SUCCESS_PCT: ${{ steps.parse.outputs.syncSuccessPct }}
          AUTH_SUCCESS_PCT: ${{ steps.parse.outputs.authSuccessPct }}
          CRITICAL_INCIDENTS: ${{ steps.parse.outputs.criticalIncidents }}
          BLOCKING_SUPPORT_REPORTS: ${{ steps.parse.outputs.blockingSupportReports }}
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW=''; OPERATION=''
          case "$COMMAND" in
            audit-external)
              WORKFLOW='rc-011-external-audit.yml'; OPERATION='audit'; gh workflow run "$WORKFLOW" --ref main -f tracking_issue=27 ;;
            validate-infrastructure)
              WORKFLOW='rc-011-infrastructure-readiness.yml'; OPERATION='validate'; gh workflow run "$WORKFLOW" --ref main -f action=validate -f source_commit="$SOURCE_COMMIT" ;;
            capture-infrastructure)
              WORKFLOW='rc-011-infrastructure-readiness.yml'; OPERATION='capture'; gh workflow run "$WORKFLOW" --ref main -f action=capture -f source_commit="$SOURCE_COMMIT" -f build_evidence_url="$BUILD_EVIDENCE_URL" -f homologation_evidence_url="$HOMOLOGATION_EVIDENCE_URL" -f services_evidence_url="$SERVICES_EVIDENCE_URL" ;;
            evidence-inspect|evidence-pr)
              WORKFLOW='rc-011-evidence-pr.yml'; [[ "$COMMAND" == 'evidence-inspect' ]] && OPERATION='inspect' || OPERATION='open-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f infrastructure_run_id="$RUN_ID" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
            validate-build|build-android|build-ios)
              WORKFLOW='rc-011-build.yml'; case "$COMMAND" in validate-build) OPERATION='validate' ;; build-android) OPERATION='build-android' ;; build-ios) OPERATION='build-ios' ;; esac; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f cycle_evidence_url="$CYCLE_EVIDENCE_URL" ;;
            discover-android|capture-android-latest|android-artifact-pr)
              WORKFLOW='rc-011-android-artifact.yml'; case "$COMMAND" in discover-android) OPERATION='discover-android' ;; capture-android-latest) OPERATION='capture-android' ;; android-artifact-pr) OPERATION='open-artifact-pr' ;; esac; ARGS=(-f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER"); [[ "$COMMAND" == 'android-artifact-pr' ]] && ARGS+=(-f capture_run_id="$RUN_ID"); gh workflow run "$WORKFLOW" --ref main "${ARGS[@]}" ;;
            discover-ios|capture-ios-latest|ios-artifact-pr)
              WORKFLOW='rc-011-ios-artifact.yml'; case "$COMMAND" in discover-ios) OPERATION='discover-ios' ;; capture-ios-latest) OPERATION='capture-ios' ;; ios-artifact-pr) OPERATION='open-artifact-pr' ;; esac; ARGS=(-f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER"); [[ "$COMMAND" == 'ios-artifact-pr' ]] && ARGS+=(-f capture_run_id="$RUN_ID"); gh workflow run "$WORKFLOW" --ref main "${ARGS[@]}" ;;
            android-session|android-session-pr|android-review)
              WORKFLOW='rc-011-android-physical-validation.yml'; case "$COMMAND" in android-session) OPERATION='capture-session'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f build_id="$BUILD_ID" -f profile_id="$PROFILE_ID" -f device_status="$RESULT_STATUS" -f installation_mode="$INSTALLATION_MODE" -f os_version="$OS_VERSION" -f evidence_url="$EVIDENCE_URL" -f suite_results="$SUITE_RESULTS" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; android-session-pr) OPERATION='open-session-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; android-review) OPERATION='package-android-review'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; esac ;;
            ios-session|ios-session-pr|multiplatform-review)
              WORKFLOW='rc-011-ios-physical-validation.yml'; case "$COMMAND" in ios-session) OPERATION='capture-session'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f build_id="$BUILD_ID" -f profile_id="$PROFILE_ID" -f device_status="$RESULT_STATUS" -f installation_mode="$INSTALLATION_MODE" -f os_version="$OS_VERSION" -f evidence_url="$EVIDENCE_URL" -f suite_results="$SUITE_RESULTS" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; ios-session-pr) OPERATION='open-session-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; multiplatform-review) OPERATION='package-multiplatform-review'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;; esac ;;
            collect-android|collect-ios)
              WORKFLOW='rc-011-homologation.yml'; [[ "$COMMAND" == 'collect-android' ]] && OPERATION='collect-android-build' || OPERATION='collect-ios-build'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f build_id="$BUILD_ID" ;;
            package-decision)
              WORKFLOW='rc-011-homologation.yml'; OPERATION='package-decision'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" ;;
            ota-publish|ota-publish-pr|ota-session|ota-session-pr|ota-rollback|ota-rollback-pr|rc-final-review)
              WORKFLOW='rc-011-ota-final-validation.yml'
              case "$COMMAND" in
                ota-publish) OPERATION='publish-validation'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                ota-publish-pr) OPERATION='open-publish-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                ota-session) OPERATION='capture-device-session'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f platform="$PLATFORM" -f build_id="$BUILD_ID" -f profile_id="$PROFILE_ID" -f os_version="$OS_VERSION" -f update_group_id="$GROUP_ID" -f ota_action="$OTA_ACTION" -f evidence_url="$EVIDENCE_URL" -f check_results="$OTA_RESULTS" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                ota-session-pr) OPERATION='open-session-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                ota-rollback) OPERATION='rollback-validation'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f update_group_id="$GROUP_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                ota-rollback-pr) OPERATION='open-rollback-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                rc-final-review) OPERATION='package-final-decision'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
              esac ;;
            production-package|final-attestation|final-attestation-pr|production-build-android|production-build-ios|production-artifact-pr|rollout-observation|rollout-observation-pr)
              WORKFLOW='rc-011-production-activation.yml'
              case "$COMMAND" in
                production-package) OPERATION='package-activation'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                final-attestation) OPERATION='capture-attestation'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f attestation_role="$ATTESTATION_ROLE" -f attestation_decision="$ATTESTATION_DECISION" -f evidence_url="$EVIDENCE_URL" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                final-attestation-pr) OPERATION='open-attestation-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                production-build-android) OPERATION='build-production-android'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                production-build-ios) OPERATION='build-production-ios'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                production-artifact-pr) OPERATION='open-production-artifact-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                rollout-observation) OPERATION='capture-rollout-observation'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f rollout_percentage="$ROLLOUT_PERCENTAGE" -f crash_free_pct="$CRASH_FREE_PCT" -f sync_success_pct="$SYNC_SUCCESS_PCT" -f auth_success_pct="$AUTH_SUCCESS_PCT" -f critical_incidents="$CRITICAL_INCIDENTS" -f blocking_support_reports="$BLOCKING_SUPPORT_REPORTS" -f evidence_url="$EVIDENCE_URL" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
                rollout-observation-pr) OPERATION='open-rollout-pr'; gh workflow run "$WORKFLOW" --ref main -f action="$OPERATION" -f source_commit="$SOURCE_COMMIT" -f capture_run_id="$RUN_ID" -f tracking_issue="$RC011_ISSUE_NUMBER" ;;
              esac ;;
            *) echo 'Comando não mapeado.' >&2; exit 1 ;;
          esac
          cat > /tmp/rc011-dispatch.md <<EOF
          ## Operação RC 0.11 aceita

          - Comando: \`$COMMAND\`
          - Workflow: \`$WORKFLOW\`
          - Operação: \`$OPERATION\`
          - Commit: \`${SOURCE_COMMIT:-não aplicável}\`
          - Solicitante: \`$RC011_ACTOR\`

          A solicitação foi enviada ao GitHub Actions. Environments e revisores continuam podendo bloquear a execução. Nenhum resultado, gate, release, submissão ou rollout foi aprovado por este despacho.

          **Tehkné Solutions**
          EOF
          gh issue comment "$RC011_ISSUE_NUMBER" --body-file /tmp/rc011-dispatch.md
