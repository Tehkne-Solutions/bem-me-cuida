name: Sprint 32

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sprint32.yml'
      - 'release/cycle-0.12.0/review-package.json'
      - 'release/cycle-0.12.0/threat-model.json'
      - 'release/cycle-0.12.0/approval-policy.json'
      - 'scripts/test-cycle012-review-package.mjs'
      - 'scripts/verify-cycle012-review-package.mjs'
      - 'scripts/verify-sprint32-readiness.mjs'
      - 'docs/SPRINT-32.md'
      - 'docs/ADR-036-revisao-independente-do-ciclo-0.12.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sprint32.yml'
      - 'release/cycle-0.12.0/review-package.json'
      - 'release/cycle-0.12.0/threat-model.json'
      - 'release/cycle-0.12.0/approval-policy.json'
      - 'scripts/test-cycle012-review-package.mjs'
      - 'scripts/verify-cycle012-review-package.mjs'
      - 'scripts/verify-sprint32-readiness.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  sprint32-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate Sprint 32 review package
        run: |
          node scripts/verify-sprint32-readiness.mjs
          node scripts/test-cycle012-review-package.mjs
          node scripts/verify-cycle012-review-package.mjs structure
          node scripts/verify-cycle012-review-package.mjs report
