name: Sprint 29

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cycle-012-bootstrap.yml'
      - '.github/workflows/sprint29.yml'
      - 'release/cycle-0.12.0/**'
      - 'scripts/*cycle012*'
      - 'scripts/lib/cycle012-bootstrap.mjs'
      - 'scripts/verify-sprint29-readiness.mjs'
      - 'docs/SPRINT-29.md'
      - 'docs/ADR-033-transicao-fail-closed-para-o-ciclo-0.12.md'
      - 'docs/CYCLE-0.12-BOOTSTRAP-RUNBOOK.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle-012-bootstrap.yml'
      - '.github/workflows/sprint29.yml'
      - 'release/cycle-0.12.0/**'
      - 'scripts/*cycle012*'
      - 'scripts/lib/cycle012-bootstrap.mjs'
      - 'scripts/verify-sprint29-readiness.mjs'

permissions:
  contents: read

jobs:
  sprint29-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate Sprint 29 structure
        run: |
          node scripts/verify-sprint29-readiness.mjs
          node scripts/test-cycle012-bootstrap.mjs
          node scripts/verify-cycle012-bootstrap.mjs structure
      - name: Generate blocked cycle package
        run: |
          node scripts/generate-cycle012-bootstrap-package.mjs
          node scripts/verify-cycle012-bootstrap.mjs report
      - uses: actions/upload-artifact@v4
        with:
          name: cycle012-bootstrap-${{ github.run_id }}
          path: artifacts/bemmecuida-0.12.0-bootstrap.*
          retention-days: 30

  sprint29-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: supabase start
      - run: supabase test db
      - run: supabase db lint --local
      - if: always()
        run: supabase stop --no-backup
