name: Diagnose pgTAP

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-pgtap.yml'
      - 'supabase/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - run: supabase start
      - name: Capture pgTAP
        shell: bash
        run: |
          set +e
          supabase test db > /tmp/pgtap.log 2>&1
          echo $? > /tmp/pgtap.code
          cat /tmp/pgtap.log
          exit 0
      - if: always()
        run: supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        with:
          name: pgtap-diagnostics
          path: |
            /tmp/pgtap.log
            /tmp/pgtap.code
          retention-days: 1
