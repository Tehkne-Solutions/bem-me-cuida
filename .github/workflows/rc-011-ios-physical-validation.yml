name: RC 0.11 iOS Physical Validation

on:
  workflow_dispatch:
    inputs:
      action:
        description: Capturar sessão, abrir PR ou empacotar revisão multiplataforma
        required: true
        default: package-multiplatform-review
        type: choice
        options: [capture-session, open-session-pr, package-multiplatform-review]
      source_commit:
        description: SHA do build iOS capturado
        required: true
        type: string
      build_id:
        description: Build ID do IPA
        required: false
        type: string
      profile_id:
        description: Perfil iOS da matriz
        required: false
        type: string
      device_status:
        description: passed, failed ou blocked
        required: false
        type: string
      installation_mode:
        description: fresh, upgrade ou retest
        required: false
        type: string
      os_version:
        description: Versão iOS sem identificadores do aparelho
        required: false
        type: string
      evidence_url:
        description: Evidência HTTPS sanitizada
        required: false
        type: string
      suite_results:
        description: Lista suite=status separada por vírgulas
        required: false
        type: string
      capture_run_id:
        description: Run ID da sessão revisada
        required: false
        default: '0'
        type: string
      tracking_issue:
        description: Issue operacional
        required: true
        default: '24'
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: rc011-ios-physical-${{ inputs.action }}-${{ inputs.source_commit }}-${{ inputs.capture_run_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_BUILD_ID: ${{ inputs.build_id }}
      INPUT_PROFILE_ID: ${{ inputs.profile_id }}
      INPUT_DEVICE_STATUS: ${{ inputs.device_status }}
      INPUT_INSTALLATION_MODE: ${{ inputs.installation_mode }}
      INPUT_OS_VERSION: ${{ inputs.os_version }}
      INPUT_EVIDENCE_URL: ${{ inputs.evidence_url }}
      INPUT_SUITE_RESULTS: ${{ inputs.suite_results }}
      INPUT_CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
      INPUT_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
      APP_VARIANT: rc011
      EXPO_PUBLIC_APP_ENV: rc-0-11
      EXPO_PUBLIC_APP_VERSION: 0.11.0
      EXPO_PUBLIC_RELEASE_CANDIDATE: '1'
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.RC011_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.RC011_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run rc011:infrastructure:external
      - run: npm run rc011:ios-physical:structure
      - name: Validate operation inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INPUT_SOURCE_COMMIT" =~ ^[a-fA-F0-9]{40}$ ]]
          [[ "$INPUT_TRACKING_ISSUE" =~ ^[1-9][0-9]{0,9}$ ]]
          case "$INPUT_ACTION" in
            capture-session)
              [[ "$INPUT_BUILD_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
              [[ "$INPUT_PROFILE_ID" =~ ^ios-[a-z0-9-]{2,48}$ ]]
              [[ "$INPUT_DEVICE_STATUS" =~ ^(passed|failed|blocked)$ ]]
              [[ "$INPUT_INSTALLATION_MODE" =~ ^(fresh|upgrade|retest)$ ]]
              [[ "$INPUT_OS_VERSION" =~ ^[A-Za-z0-9._-]{1,24}$ ]]
              [[ "$INPUT_EVIDENCE_URL" =~ ^https://[^[:space:]]+$ ]]
              [[ "$INPUT_SUITE_RESULTS" =~ ^[a-z0-9-]+=(passed|failed|blocked)(,[a-z0-9-]+=(passed|failed|blocked))*$ ]]
              ;;
            open-session-pr) [[ "$INPUT_CAPTURE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] ;;
            package-multiplatform-review) ;;
            *) exit 1 ;;
          esac

  capture-session:
    needs: validate
    if: inputs.action == 'capture-session'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rc-011-homologation
    env:
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_BUILD_ID: ${{ inputs.build_id }}
      INPUT_PROFILE_ID: ${{ inputs.profile_id }}
      INPUT_DEVICE_STATUS: ${{ inputs.device_status }}
      INPUT_INSTALLATION_MODE: ${{ inputs.installation_mode }}
      INPUT_OS_VERSION: ${{ inputs.os_version }}
      INPUT_EVIDENCE_URL: ${{ inputs.evidence_url }}
      INPUT_SUITE_RESULTS: ${{ inputs.suite_results }}
      INPUT_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - run: npm run rc011:ios-physical:capture
      - run: mkdir -p /tmp/rc011-ios-session
      - name: Capture sanitized session
        shell: bash
        run: |
          set -euo pipefail
          node scripts/capture-rc011-ios-session.mjs \
            --builds release/rc-0.11.0/builds.json --plan release/rc-0.11.0/ios-homologation-plan.json \
            --source-commit "$INPUT_SOURCE_COMMIT" --build-id "$INPUT_BUILD_ID" --profile-id "$INPUT_PROFILE_ID" \
            --device-status "$INPUT_DEVICE_STATUS" --installation-mode "$INPUT_INSTALLATION_MODE" --os-version "$INPUT_OS_VERSION" \
            --suite-results "$INPUT_SUITE_RESULTS" --evidence-url "$INPUT_EVIDENCE_URL" \
            --output /tmp/rc011-ios-session/ios-session.json
          SESSION_ID=$(jq -r '.sessionId' /tmp/rc011-ios-session/ios-session.json)
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: rc011-ios-session-${{ github.run_id }}
          path: /tmp/rc011-ios-session
          retention-days: 90
      - name: Publish next operation
        run: gh issue comment "$INPUT_TRACKING_ISSUE" --body "Sessão iOS capturada: \`$SESSION_ID\`\n\nRun: \`${{ github.run_id }}\`\n\nApós revisão: \`/rc011 ios-session-pr $INPUT_SOURCE_COMMIT ${{ github.run_id }}\`\n\nNenhum gate foi aprovado automaticamente.\n\nTehkné Solutions"

  open-session-pr:
    needs: validate
    if: inputs.action == 'open-session-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INPUT_SOURCE_COMMIT: ${{ inputs.source_commit }}
      INPUT_CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
      INPUT_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - name: Download reviewed session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rc011-ios-session-pr
          gh run download "$INPUT_CAPTURE_RUN_ID" --name "rc011-ios-session-$INPUT_CAPTURE_RUN_ID" --dir /tmp/rc011-ios-session-pr
          test -f /tmp/rc011-ios-session-pr/ios-session.json
          [[ "$(jq -r '.sourceCommit' /tmp/rc011-ios-session-pr/ios-session.json)" == "$INPUT_SOURCE_COMMIT" ]]
          SESSION_ID=$(jq -r '.sessionId' /tmp/rc011-ios-session-pr/ios-session.json)
          echo "SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
      - name: Apply session to reviewable records
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/rc-0.11.0/ios-sessions
          node scripts/apply-rc011-ios-session.mjs \
            --plan release/rc-0.11.0/ios-homologation-plan.json --matrix release/rc-0.11.0/device-matrix.json \
            --tests release/rc-0.11.0/test-results.json --session /tmp/rc011-ios-session-pr/ios-session.json \
            --builds release/rc-0.11.0/builds.json --android-plan release/rc-0.11.0/android-homologation-plan.json \
            --ota release/rc-0.11.0/ota-validation.json --output-plan release/rc-0.11.0/ios-homologation-plan.json \
            --output-matrix release/rc-0.11.0/device-matrix.json --output-tests release/rc-0.11.0/test-results.json \
            --output-session "release/rc-0.11.0/ios-sessions/$SESSION_ID.json" \
            --output-review release/rc-0.11.0/multiplatform-review.json
          npm run rc011:homologation:structure
          npm run rc011:ios-physical:structure
      - name: Create or reuse session PR
        id: pull
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="evidence/rc011-ios-session-$SESSION_ID"
          EXISTING_URL=$(gh pr list --state all --head "$BRANCH" --json url --jq '.[0].url // ""')
          if [[ -n "$EXISTING_URL" ]]; then echo "url=$EXISTING_URL" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "Tehkné Solutions Automation"
          git config user.email "automation@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add release/rc-0.11.0/ios-homologation-plan.json release/rc-0.11.0/device-matrix.json \
            release/rc-0.11.0/test-results.json release/rc-0.11.0/multiplatform-review.json \
            "release/rc-0.11.0/ios-sessions/$SESSION_ID.json"
          git commit -m "test(rc011): registrar sessão física iOS $SESSION_ID"
          git push origin "$BRANCH"
          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "test: registrar sessão física iOS da RC 0.11" \
            --body "Registra evidência iOS sanitizada e atualiza a revisão multiplataforma. Nenhuma promoção é automática.\n\nTehkné Solutions")
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Link issue
        run: gh issue comment "$INPUT_TRACKING_ISSUE" --body "PR da sessão iOS: ${{ steps.pull.outputs.url }}\n\nRun: $INPUT_CAPTURE_RUN_ID\n\nTehkné Solutions"

  package-multiplatform-review:
    needs: validate
    if: inputs.action == 'package-multiplatform-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22.13.1 }
      - run: npm install
      - run: npm run rc011:multiplatform:review
      - uses: actions/upload-artifact@v4
        with:
          name: rc011-multiplatform-review-${{ github.run_id }}
          path: artifacts/bemmecuida-0.11.0-rc.1-multiplatform.*
          retention-days: 90
