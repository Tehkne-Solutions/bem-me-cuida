name: Sprint 37

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cycle012-queue-update.yml'
      - '.github/workflows/sprint37.yml'
      - 'release/cycle-0.12.0/queue-update-policy.json'
      - 'release/cycle-0.12.0/queue-updates/**'
      - 'scripts/lib/cycle012-queue-update.mjs'
      - 'scripts/lib/cycle012-operations-queue.mjs'
      - 'scripts/create-cycle012-queue-update.mjs'
      - 'scripts/generate-cycle012-operations-queue.mjs'
      - 'scripts/run-cycle012-operations-command.mjs'
      - 'scripts/test-cycle012-queue-update.mjs'
      - 'scripts/verify-cycle012-queue-update.mjs'
      - 'scripts/verify-sprint37-readiness.mjs'
      - 'docs/SPRINT-37.md'
      - 'docs/ADR-041-registro-protegido-de-atualizacoes-da-fila.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cycle012-queue-update.yml'
      - '.github/workflows/sprint37.yml'
      - 'release/cycle-0.12.0/queue-update-policy.json'
      - 'release/cycle-0.12.0/queue-updates/**'
      - 'scripts/lib/cycle012-queue-update.mjs'
      - 'scripts/lib/cycle012-operations-queue.mjs'
      - 'scripts/create-cycle012-queue-update.mjs'
      - 'scripts/generate-cycle012-operations-queue.mjs'
      - 'scripts/run-cycle012-operations-command.mjs'
      - 'scripts/test-cycle012-queue-update.mjs'
      - 'scripts/verify-cycle012-queue-update.mjs'
      - 'scripts/verify-sprint37-readiness.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  sprint37-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_VARIANT: development
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - run: npm install
      - run: npm run config:check
      - run: npm run security:check
      - run: npm run release:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Validate Sprint 37 protected queue updates
        run: |
          node scripts/verify-sprint37-readiness.mjs
          node scripts/test-cycle012-queue-update.mjs
          node scripts/verify-cycle012-queue-update.mjs structure
          node scripts/verify-cycle012-queue-update.mjs report
          node scripts/create-cycle012-queue-update.mjs \
            --source-commit "$GITHUB_SHA" \
            --queue-item-id external-source-cycle-closure \
            --progress-state evidence-submitted \
            --dependency-state unchanged \
            --evidence-kind cycle-closure \
            --evidence-url https://example.com/evidence/cycle-closure \
            --actor-id 1001 \
            --submitted-at 2026-07-27T17:30:00.000Z \
            --output-dir artifacts/queue-updates
          node scripts/generate-cycle012-operations-queue.mjs \
            --source-commit "$GITHUB_SHA" \
            --json-output artifacts/cycle012-operations-queue.json \
            --markdown-output artifacts/cycle012-operations-queue.md
      - uses: actions/upload-artifact@v4
        with:
          name: sprint37-cycle012-queue-updates
          path: |
            artifacts/queue-updates/*.json
            artifacts/cycle012-operations-queue.json
            artifacts/cycle012-operations-queue.md
          if-no-files-found: error
          retention-days: 14
